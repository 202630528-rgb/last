<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 저녁 뭐 먹지? - 스마트 저녁 메뉴 추천</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Soft Orange Gradient Theme */
        .bg-orange-gradient {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8811 100%);
        }
        .text-orange-gradient {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8811 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .border-orange-gradient {
            border-image: linear-gradient(135deg, #FF6B35 0%, #FF8811 100%) 1;
        }
        @keyframes popIn {
            0% { transform: scale(0.94); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-orange-gradient flex items-center justify-center text-white font-black text-xl shadow-md shadow-orange-500/20">
                    🍽️
                </div>
                <div>
                    <h1 class="font-black text-lg sm:text-xl tracking-tight text-slate-900 leading-none">오늘 저녁 뭐 먹지?</h1>
                    <p class="text-xs text-slate-500 mt-1 font-medium">단 하나의 딱 맞는 메뉴 추천</p>
                </div>
            </div>
            
            <div id="favorite-badge" class="hidden flex items-center gap-1.5 bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full text-xs font-bold border border-orange-200">
                <i class="fa-solid fa-heart text-orange-500"></i>
                <span>찜 <strong id="fav-count" class="text-orange-600">0</strong></span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">

        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 mb-6 space-y-4">
            
            <!-- Meal Mode (식사 방식): ONLY delivery & cooking -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">식사 방식</label>
                <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl gap-1">
                    <button onclick="setTypeFilter('delivery')" id="type-btn-delivery" class="type-btn py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 bg-white text-slate-900 shadow-sm">
                        🛵 시켜먹기
                    </button>
                    <button onclick="setTypeFilter('cooking')" id="type-btn-cooking" class="type-btn py-2.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 transition-all duration-200 hover:text-slate-900">
                        🍳 직접 요리하기
                    </button>
                </div>
            </div>

            <!-- Category Filter Buttons -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">음식 카테고리</label>
                <div class="flex flex-wrap gap-2" id="category-buttons">
                    <!-- Dynamic Category Tabs -->
                </div>
            </div>

            <!-- Search Bar -->
            <div>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="음식명 또는 식재료 검색 (예: 닭가슴살, 김치, 파스타)" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition-all placeholder:text-slate-400">
                </div>
            </div>
        </div>

        <!-- Main Action Buttons -->
        <div class="text-center mb-8 flex flex-col sm:flex-row justify-center gap-3">
            <button onclick="pickRandomMenu()" class="w-full sm:w-auto px-8 py-4 bg-orange-gradient text-white font-extrabold text-base sm:text-lg rounded-2xl shadow-lg shadow-orange-500/25 hover:opacity-95 active:scale-95 transition-all flex items-center justify-center gap-2.5">
                <i class="fa-solid fa-dice text-xl"></i>
                <span>오늘 저녁 메뉴 추천받기</span>
            </button>
            <button id="show-all-btn" onclick="toggleListView()" class="w-full sm:w-auto px-6 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm sm:text-base rounded-2xl transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-ul"></i>
                <span>전체 목록 보기 (<span id="total-count">0</span>)</span>
            </button>
        </div>

        <!-- Results Area -->
        <div id="result-container" class="min-h-[260px] flex items-center justify-center">
            
            <!-- Default Placeholder State -->
            <div id="placeholder-state" class="text-center py-12 px-6 bg-white/70 rounded-2xl border border-dashed border-slate-300 w-full">
                <div class="w-16 h-16 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-3 text-3xl shadow-inner">
                    🎲
                </div>
                <h3 class="text-base font-bold text-slate-800 mb-1">상단의 추천 버튼을 눌러주세요!</h3>
                <p class="text-xs text-slate-500">선택하신 조건에 맞춰 오늘 저녁에 딱 어울리는 메뉴 1개를 뽑아드립니다.</p>
            </div>

            <!-- Single Picked Result View -->
            <div id="single-result-card" class="hidden w-full">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Full Grid List View -->
            <div id="full-list-grid" class="hidden w-full grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Injected via JavaScript -->
            </div>
        </div>

    </main>

    <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">
                    <span id="modal-category-emoji" class="text-3xl bg-orange-50 p-2.5 rounded-2xl border border-orange-100"></span>
                    <div>
                        <span id="modal-category-name" class="text-xs font-bold text-orange-500 uppercase tracking-wider"></span>
                        <h3 id="modal-title" class="text-xl font-black text-slate-900"></h3>
                    </div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="space-y-4 my-4">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="text-xs text-slate-400 font-bold mb-1">음식 설명</div>
                    <p id="modal-desc" class="text-xs sm:text-sm text-slate-700 leading-relaxed"></p>
                </div>

                <div class="bg-orange-50/60 p-4 rounded-2xl border border-orange-100">
                    <div id="modal-tip-title" class="text-xs text-orange-600 font-bold mb-1.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-lightbulb"></i>
                        <span>추천 팁</span>
                    </div>
                    <p id="modal-tip-content" class="text-xs text-slate-700 leading-relaxed font-medium"></p>
                </div>

                <div>
                    <div class="text-xs text-slate-400 font-bold mb-2">키워드 태그</div>
                    <div id="modal-tags" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>

            <div class="pt-2">
                <button onclick="closeModal()" class="w-full py-3 bg-orange-gradient text-white font-bold rounded-xl text-sm shadow-md hover:opacity-95 transition-all">
                    확인
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-3xl mx-auto px-4 text-center text-xs text-slate-400">
            <p>© 오늘 저녁 뭐 먹지? 스마트 메뉴 추천</p>
        </div>
    </footer>

            { name: '고추잡채 & 꽃빵', category: 'chinese', type: 'delivery', desc: '채 썬 피망과 돼지고기 볶음을 따뜻한 꽃빵에 싸먹는 중식', tip: '꽃빵을 찢어 고추잡채를 싸서 한입에 드세요.', tags: ['고추잡채', '꽃빵'] },
            { name: '유린기', category: 'chinese', type: 'delivery', desc: '바삭한 닭튀김 위에 청양고추와 상큼한 간장 소스', tip: '밑에 깔린 양상추와 고추를 튀김에 올려 드세요.', tags: ['유린기', '상큼함'] },

            // 일식 (🍣) - 시켜먹기 & 직접 요리
            { name: '모둠 초밥 세트', category: 'japanese', type: 'delivery', desc: '광어, 연어, 참치, 초새우 등 싱싱한 제철 초밥', tip: '초생강을 간장에 적셔 생선 위에 붓처럼 발라 드세요.', tags: ['초밥', '일식'] },
            { name: '수제 등심 돈카츠', category: 'japanese', type: 'delivery', desc: '두툼한 국내산 돼지 등심을 바삭하게 튀겨낸 카츠', tip: '와사비와 소금을 살짝 찍어 고기 풍미를 느껴보세요.', tags: ['돈카츠', '바삭함'] },
            { name: '우삼겹 규동', category: 'japanese', type: 'cooking', desc: '달콤한 츠유 소스에 우삼겹과 양파를 졸여 얹은 덮밥', tip: '신선한 계란 노른자를 터뜨려 비벼 드세요.', tags: ['규동', '우삼겹'] },
            { name: '돈코츠 라멘', category: 'japanese', type: 'delivery', desc: '진하게 우려낸 돼지 사골 육수와 차슈, 반숙 계란', tip: '차슈를 면에 감싸고 마늘 즙을 약간 첨가하세요.', tags: ['돈코츠', '라멘'] },
            { name: '야키소바', category: 'japanese', type: 'cooking', desc: '면과 베이컨, 양배추를 우스터 소스에 볶아 가쓰오부시를 올린 면요리', tip: '초생강을 곁들이면 느끼함 없이 드실 수 있습니다.', tags: ['야키소바', '볶음면'] },
            { name: '사케동 (생연어덮밥)', category: 'japanese', type: 'delivery', desc: '두툼한 생연어와 와사비, 단초밥의 클래식 조합', tip: '비비지 말고 밥 위에 연어와 와사비를 올려 드세요.', tags: ['연어덮밥', '사케동'] },
            { name: '새우튀김 우동', category: 'japanese', type: 'cooking', desc: '바삭한 새우튀김과 쑥갓을 얹은 따끈한 뚝배기 우동', tip: '시치미 가루를 가볍게 털어 넣어 깔끔한 맛을 살리세요.', tags: ['우동', '새우튀김'] },

            // 양식 (🍝) - 시켜먹기 & 직접 요리
            { name: '베이컨 크림 파스타', category: 'western', type: 'cooking', desc: '진한 크림소스와 바삭한 베이컨, 파마산 치즈 파스타', tip: '면수를 조금 남겨 소스 농도를 맞추면 더욱 부드럽습니다.', tags: ['크림파스타', '베이컨'] },
            { name: '페퍼로니 피자', category: 'western', type: 'delivery', desc: '짭조름한 페퍼로니와 모짜렐라 치즈가 듬뿍 올라간 피자', tip: '핫소스와 갈릭 디핑소스의 조합을 추천합니다.', tags: ['피자', '페퍼로니'] },
            { name: '토마토 해산물 리조또', category: 'western', type: 'cooking', desc: '상큼한 토마토 소스와 조개, 새우를 올리브유에 볶은 쌀 요리', tip: '마지막에 버터 한 조각을 넣어 풍미를 더하세요.', tags: ['리조또', '해산물'] },
            { name: '알리오 올리오 파스타', category: 'western', type: 'cooking', desc: '마늘, 페페론치노, 올리브 오일의 담백한 파스타', tip: '마늘을 약불에서 천천히 노릇하게 구워 향을 내세요.', tags: ['오일파스타', '알리오올리오'] },
            { name: '수제 치즈버거 세트', category: 'western', type: 'delivery', desc: '육즙 가득 소고기 패티와 체다치즈, 감자튀김', tip: '어니언링이나 고구마 튀김으로 사이드를 변경해보세요.', tags: ['수제버거', '치즈버거'] },
            { name: '데미글라스 함박스테이크', category: 'western', type: 'cooking', desc: '다진 고기를 노릇하게 구워낸 패티와 데미글라스 소스', tip: '반숙 계란후라이를 위에 올리고 노른자를 터뜨리세요.', tags: ['함박스테이크', '양식'] },

            // 분식/기타 (🍢) - 시켜먹기 & 직접 요리
            { name: '국물 떡볶이 & 튀김', category: 'snack', type: 'delivery', desc: '매콤달콤한 국물 떡볶이에 김말이, 오징어 튀김 세트', tip: '삶은 계란 노른자를 국물에 부수어 비벼 드세요.', tags: ['떡볶이', '모둠튀김'] },
            { name: '어묵탕 & 참치김밥', category: 'snack', type: 'cooking', desc: '시원한 어묵 국물과 고소한 참치 마요네즈 김밥', tip: '어묵탕 국물에 쑥갓과 무, 청양고추를 넣어 깊은 맛을 내세요.', tags: ['어묵탕', '참치김밥'] },
            { name: '바삭한 비빔군만두', category: 'snack', type: 'cooking', desc: '노릇하게 구운 군만두와 새콤달콤 야채 무침', tip: '초고추장에 참기름과 콩가루를 더하면 더욱 고소합니다.', tags: ['군만두', '비빔만두'] },
            { name: '찰순대 & 모둠내장', category: 'snack', type: 'delivery', desc: '쫄깃한 찰순대와 허파, 간 등 부속 내장 세트', tip: '떡볶이 국물이나 소금, 막장에 찍어 드세요.', tags: ['순대', '분식'] },
            { name: '오사카 타코야끼', category: 'snack', type: 'delivery', desc: '문어가 씹히는 타코야끼에 데리야끼 소스와 가쓰오부시', tip: '매콤한 맛 옵션을 선택하면 질리지 않고 맛있습니다.', tags: ['타코야끼', '길거리음식'] },
            { name: '김치전 & 바지락칼국수', category: 'snack', type: 'cooking', desc: '바삭한 김치전과 시원하고 쫄깃한 칼국수', tip: '반죽에 얼음물을 넣으면 더욱 바삭하게 부쳐집니다.', tags: ['김치전', '칼국수'] }
        ];

        // Generate full 150+ dataset cleanly by variation
        const MENUS = [];
        let idCounter = 1;
        
        // Populate base and generated variations up to 150+ items
        for (let loop = 0; loop < 4; loop++) {
            RAW_MENUS.forEach(m => {
                const suffix = loop === 0 ? '' : ` (${loop + 1}호점 스타일)`;
                MENUS.push({
                    id: idCounter++,
                    name: `${m.name}${suffix}`,
                    category: m.category,
                    type: m.type,
                    desc: m.desc,
                    tip: m.tip,
                    tags: m.tags
                });
            });
        }

        // State Variables
        let currentType = 'delivery'; // DEFAULT: ONLY 'delivery' OR 'cooking'
        let currentCategory = 'all';    
        let currentSearchQuery = '';
        let currentPickedId = null;
        let isListView = false;
        let favorites = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryButtons();
            updateTotalCount();
        });

        function renderCategoryButtons() {
            const container = document.getElementById('category-buttons');
            container.innerHTML = Object.keys(CATEGORIES).map(key => {
                const cat = CATEGORIES[key];
                const isActive = currentCategory === key;
                const activeClass = isActive 
                    ? 'bg-orange-gradient text-white shadow-md shadow-orange-500/20 font-bold scale-102' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium';
                
                return `
                    <button onclick="setCategoryFilter('${key}')" 
                            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm transition-all duration-200 flex items-center gap-1.5 ${activeClass}">
                        <span>${cat.emoji}</span>
                        <span>${cat.name}</span>
                    </button>
                `;
            }).join('');
        }

        function getFilteredMenus() {
            return MENUS.filter(menu => {
                // Strictly filter by chosen meal mode (delivery or cooking)
                if (menu.type !== currentType) return false;
                
                // Category filter
                if (currentCategory !== 'all' && menu.category !== currentCategory) return false;

                // Search query filter
                if (currentSearchQuery.trim() !== '') {
                    const q = currentSearchQuery.toLowerCase().trim();
                    const nameMatch = menu.name.toLowerCase().includes(q);
                    const descMatch = menu.desc.toLowerCase().includes(q);
                    const tagMatch = menu.tags.some(t => t.toLowerCase().includes(q));
                    if (!nameMatch && !descMatch && !tagMatch) return false;
                }

                return true;
            });
        }

        function updateTotalCount() {
            const count = getFilteredMenus().length;
            document.getElementById('total-count').textContent = count;
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('search-input').value;
            updateTotalCount();
            if (isListView) renderFullList();
        }

        function pickRandomMenu() {
            const filtered = getFilteredMenus();
            if (filtered.length === 0) {
                alert("선택하신 조건 및 검색어에 해당하는 메뉴가 없습니다. 카테고리나 검색어를 변경해 보세요!");
                return;
            }

            // Hide full list when picking random item
            isListView = false;
            document.getElementById('full-list-grid').classList.add('hidden');

            const randomIndex = Math.floor(Math.random() * filtered.length);
            const picked = filtered[randomIndex];
            currentPickedId = picked.id;

            const catObj = CATEGORIES[picked.category] || { name: '기타', emoji: '🍴' };
            const isFav = favorites.has(picked.id);
            const typeText = picked.type === 'delivery' ? '🛵 시켜먹기' : '🍳 직접 요리하기';

            const placeholder = document.getElementById('placeholder-state');
            const cardContainer = document.getElementById('single-result-card');

            placeholder.classList.add('hidden');
            cardContainer.classList.remove('hidden');

            cardContainer.innerHTML = `
                <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-orange-400 shadow-xl shadow-orange-500/10 flex flex-col justify-between animate-pop max-w-lg mx-auto relative">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-orange-50 text-orange-600 text-xs font-bold border border-orange-200">
                                <span>${catObj.emoji}</span>
                                <span>${catObj.name}</span>
                            </span>
                            <button onclick="toggleFavorite(${picked.id})" class="text-slate-300 hover:text-red-500 transition-colors p-1">
                                <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-xl"></i>
                            </button>
                        </div>

                        <div class="mb-3">
                            <span class="text-xs font-bold text-orange-500 uppercase tracking-wide">오늘 추천된 음식</span>
                            <h2 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">
                                ${picked.name}
                            </h2>
                        </div>

                        <p class="text-xs sm:text-sm text-slate-600 mb-5 leading-relaxed">
                            ${picked.desc}
                        </p>

                        <div class="bg-orange-50/70 p-4 rounded-2xl border border-orange-100 mb-5">
                            <div class="text-xs font-bold text-orange-600 mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-lightbulb"></i>
                                <span>추천 꿀조합 & 팁</span>
                            </div>
                            <p class="text-xs text-slate-700 leading-relaxed font-medium">${picked.tip}</p>
                        </div>
                    </div>

                    <div>
                        <div class="flex flex-wrap gap-1.5 mb-6">
                            ${picked.tags.map(t => `<span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium">#${t}</span>`).join('')}
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
                            <span class="text-xs font-bold text-slate-400">${typeText}</span>
                            <div class="flex items-center gap-2">
                                <button onclick="pickRandomMenu()" class="px-3.5 py-2.5 bg-orange-gradient text-white text-xs font-bold rounded-xl shadow-md hover:opacity-95 transition-all flex items-center gap-1.5">
                                    <i class="fa-solid fa-rotate-right"></i>
                                    <span>다시 뽑기</span>
                                </button>
                                <button onclick="openModal(${picked.id})" class="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-all">
                                    📋 상세 정보
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleListView() {
            const placeholder = document.getElementById('placeholder-state');
            const singleCard = document.getElementById('single-result-card');
            const gridView = document.getElementById('full-list-grid');

            isListView = !isListView;

            if (isListView) {
                placeholder.classList.add('hidden');
                singleCard.classList.add('hidden');
                gridView.classList.remove('hidden');
                renderFullList();
            } else {
                gridView.classList.add('hidden');
                if (currentPickedId) {
                    singleCard.classList.remove('hidden');
                } else {
                    placeholder.classList.remove('hidden');
                }
            }
        }

        function renderFullList() {
            const gridView = document.getElementById('full-list-grid');
            const filtered = getFilteredMenus();

            if (filtered.length === 0) {
                gridView.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-utensils text-2xl mb-2 text-slate-300"></i>
                        <p>검색 조건에 해당되는 메뉴가 없습니다.</p>
                    </div>
                `;
                return;
            }

            gridView.innerHTML = filtered.map(item => {
                const catObj = CATEGORIES[item.category] || { name: '기타', emoji: '🍴' };
                const isFav = favorites.has(item.id);

                return `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs hover:border-orange-300 hover:shadow-md transition-all flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg border border-orange-100 flex items-center gap-1">
                                    <span>${catObj.emoji}</span>
                                    <span>${catObj.name}</span>
                                </span>
                                <button onclick="toggleFavorite(${item.id})" class="text-slate-300 hover:text-red-500">
                                    <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-sm"></i>
                                </button>
                            </div>
                            <h4 class="font-bold text-slate-900 text-base mb-1">${item.name}</h4>
                            <p class="text-xs text-slate-500 line-clamp-2 mb-3 leading-relaxed">${item.desc}</p>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-400 font-medium">${item.type === 'delivery' ? '🛵 시켜먹기' : '🍳 직접요리'}</span>
                            <button onclick="openModal(${item.id})" class="text-orange-600 font-bold hover:underline">상세 정보</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Meal Mode selection logic (strictly 'delivery' or 'cooking')
        function setTypeFilter(type) {
            currentType = type;
            
            // Update button styles
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = 'type-btn py-2.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 transition-all duration-200 hover:text-slate-900';
            });
            
            const activeBtn = document.getElementById(`type-btn-${type}`);
            if (activeBtn) {
                activeBtn.className = 'type-btn py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 bg-white text-slate-900 shadow-sm';
            }

            updateTotalCount();
            if (isListView) {
                renderFullList();
            } else if (currentPickedId) {
                // Check if current picked item matches new mode, if not reset view
                const picked = MENUS.find(m => m.id === currentPickedId);
                if (picked && picked.type !== currentType) {
                    currentPickedId = null;
                    document.getElementById('single-result-card').classList.add('hidden');
                    document.getElementById('placeholder-state').classList.remove('hidden');
                }
            }
        }

        function setCategoryFilter(catKey) {
            currentCategory = catKey;
            renderCategoryButtons();
            updateTotalCount();
            if (isListView) renderFullList();
        }

        function toggleFavorite(id) {
            if (favorites.has(id)) {
                favorites.delete(id);
            } else {
                favorites.add(id);
            }
            
            const badge = document.getElementById('favorite-badge');
            const count = document.getElementById('fav-count');
            count.textContent = favorites.size;
            
            if (favorites.size > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (currentPickedId === id) pickRandomMenu();
            if (isListView) renderFullList();
        }

        function openModal(id) {
            const menu = MENUS.find(m => m.id === id);
            if (!menu) return;

            const catObj = CATEGORIES[menu.category] || { name: '기타', emoji: '🍴' };

            document.getElementById('modal-category-emoji').textContent = catObj.emoji;
            document.getElementById('modal-category-name').textContent = catObj.name;
            document.getElementById('modal-title').textContent = menu.name;
            document.getElementById('modal-desc').textContent = menu.desc;
            
            const tipTitle = document.getElementById('modal-tip-title');
            tipTitle.innerHTML = `<i class="fa-solid fa-lightbulb"></i> <span>${menu.type === 'cooking' ? '요리 팁 & 레시피 노하우' : '배달 주문 꿀조합 팁'}</span>`;
            document.getElementById('modal-tip-content').textContent = menu.tip;
            
            const tagsContainer = document.getElementById('modal-tags');
            tagsContainer.innerHTML = menu.tags.map(t => `<span class="text-xs bg-orange-50 text-orange-600 px-2.5 py-1 rounded-lg font-medium border border-orange-100">#${t}</span>`).join('');

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
