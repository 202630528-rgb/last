    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* Soft Orange Gradient Theme */
        .bg-orange-gradient {
            background: linear-gradient(135deg, #FF6B00 0%, #FF8800 100%);
        }
        .text-orange-gradient {
            background: linear-gradient(135deg, #FF6B00 0%, #FF8800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes popIn {
            0% { transform: scale(0.94); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-orange-gradient flex items-center justify-center text-white font-black text-xl shadow-md shadow-orange-500/20">
                    🍽️
                </div>
                <div>
                    <h1 class="font-black text-lg sm:text-xl tracking-tight text-slate-900 leading-none">오늘 저녁 뭐 먹지?</h1>
                    <p class="text-xs text-slate-500 mt-1 font-medium">스마트 단일 메뉴 추천</p>
                </div>
            </div>
            
            <div id="favorite-badge" class="hidden flex items-center gap-1.5 bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full text-xs font-bold border border-orange-200">
                <i class="fa-solid fa-heart text-orange-500"></i>
                <span>찜 <strong id="fav-count" class="text-orange-600">0</strong></span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">

        <!-- Filters Section -->
        <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-xs border border-slate-200/80 mb-6 space-y-4">
            
            <!-- Meal Mode (Strictly 2 modes only) -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">식사 방식</label>
                <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl gap-1">
                    <button onclick="setTypeFilter('delivery')" id="type-btn-delivery" class="type-btn py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 bg-white text-slate-900 shadow-xs">
                        🛵 시켜먹기
                    </button>
                    <button onclick="setTypeFilter('cooking')" id="type-btn-cooking" class="type-btn py-2.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 transition-all duration-200 hover:text-slate-900">
                        🍳 직접 요리하기
                    </button>
                </div>
            </div>

            <!-- Category Filter Buttons -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">음식 카테고리</label>
                <div class="flex flex-wrap gap-2" id="category-buttons">
                    <!-- Dynamic Category Tabs -->
                </div>
            </div>

            <!-- Search Bar -->
            <div>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="음식명 또는 식재료 검색 (예: 닭가슴살, 김치, 파스타)" 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-orange-500 focus:bg-white transition-all placeholder:text-slate-400">
                </div>
            </div>
        </div>

        <!-- Main Action Buttons -->
        <div class="text-center mb-8 flex flex-col sm:flex-row justify-center gap-3">
            <button onclick="pickRandomMenu()" class="w-full sm:w-auto px-8 py-4 bg-orange-gradient text-white font-extrabold text-base sm:text-lg rounded-2xl shadow-lg shadow-orange-500/25 hover:opacity-95 active:scale-95 transition-all flex items-center justify-center gap-2.5 cursor-pointer">
                <i class="fa-solid fa-dice text-xl"></i>
                <span>오늘 저녁 메뉴 추천받기</span>
            </button>
            <button id="show-all-btn" onclick="toggleListView()" class="w-full sm:w-auto px-6 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm sm:text-base rounded-2xl transition-all flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-list-ul"></i>
                <span id="list-toggle-text">전체 목록 보기 (<span id="total-count">0</span>)</span>
            </button>
        </div>

        <div id="result-container" class="min-h-[280px] flex items-center justify-center">

            <div id="placeholder-state" class="text-center py-12 px-6 bg-white/80 rounded-3xl border border-dashed border-slate-300 w-full shadow-xs">

            </div>

            <!-- Single Picked Result View -->
            <div id="single-result-card" class="hidden w-full">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Full Grid List View -->
            <div id="full-list-grid" class="hidden w-full grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Injected via JavaScript -->
            </div>
        </div>

    </main>

    <!-- Detail & Recipe Modal -->
    <div id="detail-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-center gap-3">

                    <div>
                        <span id="modal-category-name" class="text-xs font-bold text-orange-500 uppercase tracking-wider"></span>
                        <h3 id="modal-title" class="text-xl font-black text-slate-900"></h3>
                    </div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

                    <div class="text-xs text-slate-400 font-bold mb-1">메뉴 소개</div>

                </div>

                    <div class="text-xs text-amber-700 font-bold mb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-basket-shopping"></i>
                        <span>필요한 재료</span>
                    </div>
                    <p id="modal-ingredients" class="text-xs sm:text-sm text-slate-800 leading-relaxed font-medium"></p>
                </div>

                    <div id="modal-tags" class="flex flex-wrap gap-1.5"></div>

            </div>

            <div class="pt-2">

                    확인
                </button>
            </div>
        </div>
    </div>

                    '3. 생크림과 우유를 붓고 약불에서 보글보글 끓여 소스를 잡습니다.',
                    '4. 삶은 면과 파마산 치즈, 면수 3스푼을 넣고 농도가 자작해질 때까지 2분간 볶아 완성합니다.'
                ],
                tags: ['크림파스타', '베이컨', '양식']
            },
            { 
                id: 113, name: '알리오 올리오 파스타', category: 'western', type: 'cooking', 
                desc: '올리브 오일에 마늘 풍미와 페페론치노의 알싸함을 담은 오일 파스타',
                ingredients: '파스타면 100g, 통마늘 7알, 페페론치노 4개, 엑스트라버진 올리브유 5큰술, 소금, 후추, 파슬리',
                recipeSteps: [
                    '1. 마늘은 편으로 얇게 슬라이스하고, 페페론치노는 손으로 반을 부수어 준비합니다.',
                    '2. 끓는 물에 소금을 넣고 면을 8분간 삶아줍니다.',
                    '3. 팬에 올리브유 5큰술을 두르고 편마늘을 약불에서 노릇한 갈색이 될 때까지 천천히 구워 향을 냅니다.',
                    '4. 페페론치노와 삶은 면, 면수 1/2컵을 넣고 강하게 저어 오일과 물이 유화되도록 볶아냅니다.'
                ],
                tags: ['오일파스타', '알리오올리오', '마늘']
            },

            // 분식/기타 (🍢)
            { 
                id: 114, name: '어묵탕 & 참치김밥', category: 'snack', type: 'cooking', 
                desc: '시원하고 뜨끈한 어묵 국물과 고소한 참치마요 김밥의 정겨운 조합',
                ingredients: '모둠 어묵 200g, 무 100g, 대파, 멸치다시팩 1개, 밥 1공기, 참치캔 1개, 마요네즈 2큰술, 김밥용 김 1장, 깻잎 2장',
                recipeSteps: [
                    '1. 냄비에 물 800ml, 무, 다시팩을 넣고 10분간 끓여 깊은 육수를 만듭니다.',
                    '2. 육수에 어묵과 국간장 1.5큰술, 썰어둔 대파를 넣고 끓여 어묵탕을 완성합니다.',
                    '3. 참치는 기름을 짜내고 마요네즈, 설탕 한 꼬집과 섞어 참치마요를 만듭니다.',
                    '4. 김 위에 참기름과 소금으로 간한 밥을 펴고 깻잎과 참치마요를 올려 돌돌 말아 김밥을 쌉니다.'
                ],
                tags: ['어묵탕', '참치김밥', '분식']
            },
            { 
                id: 115, name: '바삭한 비빔군만두', category: 'snack', type: 'cooking', 
                desc: '노릇하고 바삭하게 구운 군만두와 새콤달콤한 야채 무침의 별미',
                ingredients: '냉동 군만두 8개, 양배추 100g, 당근 약간, 초고추장 3큰술, 참기름 1큰술, 콩가루/통깨 약간',
                recipeSteps: [
                    '1. 양배추와 당근은 가늘게 채 썰어 차가운 물에 담갔다가 물기를 털어냅니다.',
                    '2. 달군 팬에 기름을 넉넉히 두르고 냉동 만두를 중약불에서 사면이 노릇하게 바삭 구워줍니다.',
                    '3. 볼에 채 썬 야채와 초고추장, 참기름을 넣어 새콤하게 무쳐줍니다.',
                    '4. 접시 가장자리에 군만두를 두르고 가운데 야채 무침을 수북이 올려 함께 싸서 드세요.'
                ],
                tags: ['군만두', '비빔만두', '초간단']
            }
        ];

        let currentType = 'delivery'; // Default mode: strictly 'delivery' or 'cooking'
        let currentCategory = 'all';    
        let currentSearchQuery = '';
        let currentPickedId = null;
        let isListView = false;
        let favorites = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryButtons();
            updateTotalCount();
        });

        function renderCategoryButtons() {
            const container = document.getElementById('category-buttons');
            container.innerHTML = Object.keys(CATEGORIES).map(key => {
                const cat = CATEGORIES[key];
                const isActive = currentCategory === key;
                const activeClass = isActive 
                    ? 'bg-orange-gradient text-white shadow-md shadow-orange-500/20 font-bold scale-102' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium';
                
                return `
                    <button onclick="setCategoryFilter('${key}')" 
                            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm transition-all duration-200 flex items-center gap-1.5 cursor-pointer ${activeClass}">
                        <span>${cat.emoji}</span>
                        <span>${cat.name}</span>
                    </button>
                `;
            }).join('');
        }

        function getFilteredMenus() {
            return MENUS.filter(menu => {
                // Strictly filter by chosen meal mode
                if (menu.type !== currentType) return false;
                
                // Category filter
                if (currentCategory !== 'all' && menu.category !== currentCategory) return false;

                // Search filter
                if (currentSearchQuery.trim() !== '') {
                    const q = currentSearchQuery.toLowerCase().trim();
                    const nameMatch = menu.name.toLowerCase().includes(q);
                    const descMatch = menu.desc.toLowerCase().includes(q);
                    const tagMatch = menu.tags.some(t => t.toLowerCase().includes(q));
                    if (!nameMatch && !descMatch && !tagMatch) return false;
                }

                return true;
            });
        }

        function updateTotalCount() {
            const count = getFilteredMenus().length;
            document.getElementById('total-count').textContent = count;
        }

        function handleSearch() {
            currentSearchQuery = document.getElementById('search-input').value;
            updateTotalCount();
            if (isListView) renderFullList();
        }

        function pickRandomMenu() {
            const filtered = getFilteredMenus();
            if (filtered.length === 0) {
                alert("선택한 식사 방식 및 카테고리에 해당하는 메뉴가 없습니다. 카테고리를 변경해보세요!");
                return;
            }

            // Hide list view when picking single random
            isListView = false;
            document.getElementById('full-list-grid').classList.add('hidden');
            document.getElementById('list-toggle-text').innerHTML = `전체 목록 보기 (<span id="total-count">${filtered.length}</span>)`;

            const randomIndex = Math.floor(Math.random() * filtered.length);
            const picked = filtered[randomIndex];
            currentPickedId = picked.id;

            const catObj = CATEGORIES[picked.category] || { name: '기타', emoji: '🍴' };
            const isFav = favorites.has(picked.id);
            const typeText = picked.type === 'delivery' ? '🛵 시켜먹기' : '🍳 직접 요리하기';

            const placeholder = document.getElementById('placeholder-state');
            const cardContainer = document.getElementById('single-result-card');

            placeholder.classList.add('hidden');
            cardContainer.classList.remove('hidden');

            cardContainer.innerHTML = `
                <div class="bg-white rounded-3xl p-6 sm:p-8 border-2 border-orange-400 shadow-xl shadow-orange-500/10 flex flex-col justify-between animate-pop max-w-lg mx-auto relative">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-orange-50 text-orange-600 text-xs font-bold border border-orange-200">
                                <span>${catObj.emoji}</span>
                                <span>${catObj.name}</span>
                            </span>
                            <button onclick="toggleFavorite(${picked.id})" class="text-slate-300 hover:text-red-500 transition-colors p-1 cursor-pointer">
                                <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-xl"></i>
                            </button>
                        </div>

                        <div class="mb-3">
                            <span class="text-xs font-bold text-orange-500 uppercase tracking-wide">오늘 저녁 추천 메뉴</span>
                            <!-- Clean Dish Name with NO branch suffixes -->
                            <h2 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">
                                ${picked.name}
                            </h2>
                        </div>

                        <p class="text-xs sm:text-sm text-slate-600 mb-5 leading-relaxed">
                            ${picked.desc}
                        </p>

                        <div class="bg-orange-50/70 p-4 rounded-2xl border border-orange-100 mb-5">
                            <div class="text-xs font-bold text-orange-600 mb-1 flex items-center gap-1">
                                <i class="fa-solid fa-lightbulb"></i>
                                <span>${picked.type === 'cooking' ? '조리 포인트' : '추천 팁'}</span>
                            </div>
                            <p class="text-xs text-slate-700 leading-relaxed font-medium">${picked.tip || (picked.recipeSteps ? picked.recipeSteps[0] : '')}</p>
                        </div>
                    </div>

                    <div>
                        <div class="flex flex-wrap gap-1.5 mb-6">
                            ${picked.tags.map(t => `<span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium">#${t}</span>`).join('')}
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
                            <span class="text-xs font-bold text-slate-400">${typeText}</span>
                            <div class="flex items-center gap-2">
                                <button onclick="pickRandomMenu()" class="px-3.5 py-2.5 bg-orange-gradient text-white text-xs font-bold rounded-xl shadow-md hover:opacity-95 transition-all flex items-center gap-1.5 cursor-pointer">
                                    <i class="fa-solid fa-rotate-right"></i>
                                    <span>다른 메뉴 뽑기</span>
                                </button>
                                <button onclick="openModal(${picked.id})" class="px-3.5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-all cursor-pointer">
                                    ${picked.type === 'cooking' ? '📖 조리법 보기' : '📋 상세 정보'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleListView() {
            const placeholder = document.getElementById('placeholder-state');
            const singleCard = document.getElementById('single-result-card');
            const gridView = document.getElementById('full-list-grid');

            isListView = !isListView;

            if (isListView) {
                placeholder.classList.add('hidden');
                singleCard.classList.add('hidden');
                gridView.classList.remove('hidden');
                document.getElementById('list-toggle-text').innerHTML = `추천 카드로 돌아가기`;
                renderFullList();
            } else {
                gridView.classList.add('hidden');
                document.getElementById('list-toggle-text').innerHTML = `전체 목록 보기 (<span id="total-count">${getFilteredMenus().length}</span>)`;
                if (currentPickedId) {
                    singleCard.classList.remove('hidden');
                } else {
                    placeholder.classList.remove('hidden');
                }
            }
        }

        function renderFullList() {
            const gridView = document.getElementById('full-list-grid');
            const filtered = getFilteredMenus();

            if (filtered.length === 0) {
                gridView.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400 text-sm bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-utensils text-2xl mb-2 text-slate-300"></i>
                        <p>검색 조건에 해당되는 메뉴가 없습니다.</p>
                    </div>
                `;
                return;
            }

            gridView.innerHTML = filtered.map(item => {
                const catObj = CATEGORIES[item.category] || { name: '기타', emoji: '🍴' };
                const isFav = favorites.has(item.id);

                return `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs hover:border-orange-300 hover:shadow-md transition-all flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg border border-orange-100 flex items-center gap-1">
                                    <span>${catObj.emoji}</span>
                                    <span>${catObj.name}</span>
                                </span>
                                <button onclick="toggleFavorite(${item.id})" class="text-slate-300 hover:text-red-500 cursor-pointer">
                                    <i class="${isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-sm"></i>
                                </button>
                            </div>
                            <!-- Clean Dish Name -->
                            <h4 class="font-bold text-slate-900 text-base mb-1">${item.name}</h4>
                            <p class="text-xs text-slate-500 line-clamp-2 mb-3 leading-relaxed">${item.desc}</p>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-400 font-medium">${item.type === 'delivery' ? '🛵 시켜먹기' : '🍳 직접요리'}</span>
                            <button onclick="openModal(${item.id})" class="text-orange-600 font-bold hover:underline cursor-pointer">
                                ${item.type === 'cooking' ? '조리법 보기' : '상세 정보'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Meal Mode Filter Logic (Strictly 'delivery' or 'cooking')
        function setTypeFilter(type) {
            currentType = type;
            
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = 'type-btn py-2.5 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 transition-all duration-200 hover:text-slate-900 cursor-pointer';
            });
            
            const activeBtn = document.getElementById(`type-btn-${type}`);
            if (activeBtn) {
                activeBtn.className = 'type-btn py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-200 bg-white text-slate-900 shadow-xs cursor-pointer';
            }

            updateTotalCount();
            if (isListView) {
                renderFullList();
            } else if (currentPickedId) {
                const picked = MENUS.find(m => m.id === currentPickedId);
                if (picked && picked.type !== currentType) {
                    currentPickedId = null;
                    document.getElementById('single-result-card').classList.add('hidden');
                    document.getElementById('placeholder-state').classList.remove('hidden');
                }
            }
        }

        function setCategoryFilter(catKey) {
            currentCategory = catKey;
            renderCategoryButtons();
            updateTotalCount();
            if (isListView) renderFullList();
        }

        function toggleFavorite(id) {
            if (favorites.has(id)) {
                favorites.delete(id);
            } else {
                favorites.add(id);
            }
            
            const badge = document.getElementById('favorite-badge');
            const count = document.getElementById('fav-count');
            count.textContent = favorites.size;
            
            if (favorites.size > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (currentPickedId === id) pickRandomMenu();
            if (isListView) renderFullList();
        }

        function openModal(id) {
            const menu = MENUS.find(m => m.id === id);
            if (!menu) return;

            const catObj = CATEGORIES[menu.category] || { name: '기타', emoji: '🍴' };

            document.getElementById('modal-category-emoji').textContent = catObj.emoji;
            document.getElementById('modal-category-name').textContent = catObj.name;
            document.getElementById('modal-title').textContent = menu.name;
            document.getElementById('modal-desc').textContent = menu.desc;

            const ingredientsBox = document.getElementById('modal-ingredients-box');
            const recipeBox = document.getElementById('modal-recipe-box');
            const recipeTitle = document.getElementById('modal-recipe-title');
            const recipeContent = document.getElementById('modal-recipe-content');

            if (menu.type === 'cooking' && menu.recipeSteps) {
                // Detailed Cooking Mode View
                ingredientsBox.classList.remove('hidden');
                document.getElementById('modal-ingredients').textContent = menu.ingredients || '기본 식재료';

                recipeTitle.innerHTML = `<i class="fa-solid fa-fire-burner"></i> <span>단계별 조리 순서</span>`;
                recipeContent.innerHTML = menu.recipeSteps.map(step => `
                    <div class="p-2.5 bg-white rounded-xl border border-orange-100 shadow-2xs font-medium text-slate-800">
                        ${step}
                    </div>
                `).join('');
            } else {
                // Delivery Mode View
                ingredientsBox.classList.add('hidden');
                recipeTitle.innerHTML = `<i class="fa-solid fa-lightbulb"></i> <span>주문 팁 & 추천 꿀조합</span>`;
                recipeContent.innerHTML = `
                    <div class="p-3 bg-white rounded-xl border border-orange-100 text-slate-700 font-medium leading-relaxed">
                        ${menu.tip || '맛있게 즐기세요!'}
                    </div>
                `;
            }

            // Tags
            const tagsContainer = document.getElementById('modal-tags');
            tagsContainer.innerHTML = menu.tags.map(t => `<span class="text-xs bg-orange-50 text-orange-600 px-2.5 py-1 rounded-lg font-medium border border-orange-100">#${t}</span>`).join('');

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        document.getElementById('detail-modal').addEventListener('click', (e) => {
            if (e.target.id === 'detail-modal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
